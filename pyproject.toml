[tool.autoflake]
in-place = true

[tool.yapf]
allow_split_before_dict_value = false
coalesce_brackets = true
dedent_closing_brackets = true
split_arguments_when_comma_terminated = true
split_complex_comprehension = true
split_before_arithmetic_operator = true

[tool.isort]
extra_standard_library = [
    'typing_extensions',
]
known_third_party = [
    'datasets',
]
profile = 'hug'
src_paths = [
    'tests',
    'todd/src',
    'todd_tasks/src',
    'todd_torch/src',
]
line_length = 79
multi_line_output = 3

[tool.pydocstyle]
convention = 'google'
add-ignore = 'D100,D101,D102,D103,D104,D105,D106,D107'

[tool.mypy]
files = [
    'tests',
    'todd/src',
    'todd_tasks/src',
    'todd_torch/src',
]
plugins = 'numpy.typing.mypy_plugin'

[[tool.mypy.overrides]]
module = [
    'custom_module.*',
    'custom_object.*',
    'datasets.*',
    'ebooklib.*',
    'ffmpeg.*',
    'h5py.*',
    'ipdb.*',
    'jieba.*',
    'lvis.*',
    'pptx.*',
    'pydub.*',
    'scipy.*',
    'setuptools.*',
    'torchaudio.*',
    'torchvision.*',
    'transformers.*',
    'yapf.*',
]
ignore_missing_imports = true

[tool.codespell]
write-changes = true

[tool.pytest.ini_options]
pythonpath = [
    'todd/src',
    'todd_tasks/src',
    'todd_torch/src',
]
norecursedirs = [
    'build',
    'tests/helpers',
    'tests/test_todd/configs/py_',
]
filterwarnings = [
    'ignore::DeprecationWarning:pkg_resources:87',
    'ignore::DeprecationWarning:torch:4',
    'ignore::DeprecationWarning:torch:6',
    'ignore::FutureWarning',
]
testpaths = [
    'tests',
    'todd/src/todd',
    'todd_tasks/src/todd_tasks',
    'todd_torch/scripts',
    'todd_torch/src/todd_torch',
]
addopts = '--doctest-modules'

[tool.coverage.run]
branch = true
command_line = '-m pytest'
source = [
    'todd/src/todd',
    'todd_tasks/src/todd_tasks',
    'todd_torch/src/todd_torch',
]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',

    'def __repr__',
    'def \w+_cli\(\)',

    'raise AssertionError',
    'raise NotImplementedError',

    'if __name__ == .__main__.:',

    'class .*\(.*\bProtocol\b.*\):',
    '@(abc\.)?abstractmethod',
    '@overload',
]

[tool.commitizen]
name = 'cz_conventional_commits'
version = "0.7.0"
tag_format = 'v$version'
version_files = [
    'todd/pyproject.toml:^version',
    'todd_torch/pyproject.toml:^version',
    'todd_torch/pyproject.toml:todd_ai>=',
    'todd_tasks/pyproject.toml:^version',
    'todd_tasks/pyproject.toml:todd_ai>=',
    'todd_tasks/pyproject.toml:todd-torch>=',
    'docs/source/conf.py:^release',
    'CITATION.cff:^version',
    'todd/src/todd/__init__.py:^__version__',
]

[tool.pylint.main]
init-hook = '''
import pathlib
import sys
root = pathlib.Path.cwd()
sys.path.insert(0, str(root / 'todd' / 'src'))
sys.path.insert(0, str(root / 'todd_tasks' / 'src'))
sys.path.insert(0, str(root / 'todd_torch' / 'src'))
sys.path.append(str(root / 'tests' / 'helpers'))
'''

[tool.pylint.'messages control']
disable = [
    'attribute-defined-outside-init',
    'cyclic-import',
    'design',
    'eval-used',
    'exec-used',
    'fixme',
    'import-outside-toplevel',
    'missing-module-docstring',
    'missing-class-docstring',
    'missing-function-docstring',
    'not-callable',
    'protected-access',
    'unspecified-encoding',
    'unused-argument',
    'use-dict-literal',
    'use-list-literal',
]
enable = [
    'useless-suppression',
]

[tool.pylint.typecheck]
signature-mutators = [
    'all_gather_decorator',
    # 'parallel_conversion', # TODO: does not work
]
generated-members = [
    'cv2.*',
    'torch.*',
]

[tool.pylint.format]
expected-line-ending-format = 'LF'
max-line-length = 79

[tool.bandit]
skips = [
    'B101',
    'B614',
]
