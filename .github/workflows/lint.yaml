name: lint

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11"]
    steps:
      - uses: LutingWang/todd/.github/actions/checkout-todd@main
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Lint
        run: |
          uv pip install -U pip setuptools wheel
          uv pip install torch torchvision torchaudio
          uv pip install git+https://github.com/lvis-dataset/lvis-api.git@lvis_challenge_2021 --no-build-isolation
          uv pip install ./todd[lint,doc,test] ./todd_torch ./todd_tasks[optional]
          pre-commit install
          pre-commit run -a
